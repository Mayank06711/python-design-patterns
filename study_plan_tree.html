<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Pattern Tree — Interview Prep</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #1c2128;
    --bg-hover: #21262d;
    --border: #30363d;
    --border-light: #3d444d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --blue: #58a6ff;
    --blue-dim: #1f6feb;
    --green: #3fb950;
    --green-bg: #0d2818;
    --yellow: #d29922;
    --orange: #f0883e;
    --red: #f85149;
    --purple: #bc8cff;
    --cyan: #39d353;
    --line-color: #30363d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .header h1 span { color: var(--blue); }
  .header-sub {
    color: var(--text-secondary);
    font-size: 0.82rem;
    margin-top: 2px;
  }

  /* ── Stats Row ── */
  .stats-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
  }
  .stat-card {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    min-width: 130px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 1.7rem;
    font-weight: 800;
    line-height: 1.2;
  }
  .stat-card .label {
    font-size: 0.68rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-top: 2px;
  }
  .stat-card.green .num { color: var(--green); }
  .stat-card.blue .num { color: var(--blue); }
  .stat-card.yellow .num { color: var(--yellow); }
  .stat-card.purple .num { color: var(--purple); }

  /* ── Controls ── */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-primary);
    align-items: center;
  }
  .ctrl-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .ctrl-group::after {
    content: '';
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 8px;
  }
  .ctrl-group:last-child::after { display: none; }
  .btn {
    background: var(--bg-hover);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    user-select: none;
  }
  .btn:hover { border-color: var(--blue); color: var(--text-primary); }
  .btn.active { background: var(--blue-dim); border-color: var(--blue); color: #fff; }
  .search-box {
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    color: var(--text-primary);
    font-size: 0.78rem;
    outline: none;
    width: 200px;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .search-box::placeholder { color: var(--text-muted); }
  .search-box:focus { border-color: var(--blue); }

  /* ── Main Content ── */
  .main {
    padding: 20px 32px 60px;
    max-width: 1200px;
  }

  /* ── Overall Progress Bar ── */
  .overall-progress {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .overall-progress .label-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 0.82rem;
  }
  .overall-progress .label-row span:first-child { color: var(--text-secondary); }
  .overall-progress .label-row span:last-child { color: var(--green); font-weight: 600; }
  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--bg-hover);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--blue) 0%, var(--green) 100%);
    transition: width 0.5s ease;
  }

  /* ── Pattern Node (Root) ── */
  .pattern-node {
    margin-bottom: 6px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-secondary);
    transition: border-color 0.2s;
  }
  .pattern-node:hover { border-color: var(--border-light); }
  .pattern-node.has-solved { border-left: 3px solid var(--green); }

  .pattern-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .pattern-header:hover { background: var(--bg-tertiary); }

  .chevron {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.65rem;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .pattern-node.collapsed .chevron { transform: rotate(-90deg); }

  .pattern-number {
    background: var(--bg-hover);
    color: var(--text-muted);
    font-size: 0.65rem;
    font-weight: 700;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .pattern-name {
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--text-primary);
    flex: 1;
  }

  .pattern-count {
    color: var(--text-muted);
    font-size: 0.72rem;
  }

  .pattern-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .pattern-bar-track {
    width: 70px;
    height: 5px;
    background: var(--bg-hover);
    border-radius: 3px;
    overflow: hidden;
  }
  .pattern-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .pattern-bar-fill.green { background: var(--green); }
  .pattern-bar-fill.yellow { background: var(--yellow); }
  .pattern-bar-fill.blue { background: var(--blue); }
  .pattern-bar-pct {
    font-size: 0.68rem;
    color: var(--text-muted);
    min-width: 28px;
    text-align: right;
  }

  .pattern-recognition {
    padding: 0 16px 0 66px;
    font-size: 0.73rem;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 8px;
  }

  .pattern-body {
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.25s ease;
    max-height: 5000px;
    opacity: 1;
  }
  .pattern-node.collapsed .pattern-body {
    max-height: 0;
    opacity: 0;
  }

  /* ── Data Structure Branch ── */
  .ds-branch {
    margin: 0 12px 8px 36px;
    border-left: 2px solid var(--line-color);
    position: relative;
  }
  .ds-branch::before {
    content: '';
    position: absolute;
    top: 16px;
    left: -2px;
    width: 14px;
    height: 2px;
    background: var(--line-color);
  }

  .ds-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 20px;
    cursor: pointer;
    user-select: none;
    border-radius: 6px;
    margin-left: 12px;
    transition: background 0.15s;
  }
  .ds-header:hover { background: var(--bg-hover); }

  .ds-chevron {
    font-size: 0.55rem;
    color: var(--text-muted);
    transition: transform 0.2s;
    width: 14px;
    text-align: center;
  }
  .ds-branch.collapsed .ds-chevron { transform: rotate(-90deg); }

  .ds-icon {
    font-size: 0.85rem;
    width: 20px;
    text-align: center;
  }

  .ds-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .ds-count {
    font-size: 0.68rem;
    color: var(--text-muted);
  }

  .ds-problems {
    padding: 0 0 4px 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.2s;
    max-height: 3000px;
    opacity: 1;
  }
  .ds-branch.collapsed .ds-problems {
    max-height: 0;
    opacity: 0;
  }

  /* ── Problem Leaf ── */
  .problem {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 46px;
    font-size: 0.8rem;
    border-radius: 4px;
    margin: 1px 12px 1px 12px;
    position: relative;
    transition: background 0.12s;
  }
  .problem:hover { background: var(--bg-hover); }

  /* Connecting line from DS branch to problem */
  .problem::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    width: 12px;
    height: 2px;
    background: var(--line-color);
  }
  .problem::after {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 2px;
    height: 100%;
    background: var(--line-color);
  }
  .problem:last-child::after {
    height: 50%;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.solved { background: var(--green); box-shadow: 0 0 6px rgba(63, 185, 80, 0.3); }
  .status-dot.unsolved { background: var(--border); }

  .parent-tag {
    background: #1a2332;
    color: var(--blue);
    font-size: 0.58rem;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .problem-name {
    flex: 1;
    color: var(--text-primary);
    font-weight: 400;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .problem-name a {
    color: var(--blue);
    text-decoration: none;
    font-size: 0.73rem;
    margin-left: 4px;
  }
  .problem-name a:hover { text-decoration: underline; }

  .diff-badge {
    font-size: 0.6rem;
    padding: 1px 7px;
    border-radius: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
  .diff-badge.easy { background: rgba(63, 185, 80, 0.12); color: var(--green); }
  .diff-badge.medium { background: rgba(240, 136, 62, 0.12); color: var(--orange); }
  .diff-badge.hard { background: rgba(248, 81, 73, 0.12); color: var(--red); }

  .variant-text {
    color: var(--text-muted);
    font-size: 0.68rem;
    max-width: 250px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }

  /* ── Legend ── */
  .legend {
    margin-top: 28px;
    padding: 14px 18px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 0.75rem;
    color: var(--text-secondary);
    align-items: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .header, .controls, .main, .stats-row { padding-left: 16px; padding-right: 16px; }
    .variant-text { display: none; }
    .pattern-bar-track { width: 50px; }
    .search-box { width: 140px; }
    .problem { padding-left: 34px; }
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
</style>
</head>
<body>

<div class="header">
  <h1><span>DSA Pattern Tree</span> &mdash; Interview Prep</h1>
  <div class="header-sub">32 patterns &middot; ~215 problems &middot; Pattern &rarr; Data Structure &rarr; Problem</div>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="controls">
  <div class="ctrl-group">
    <button class="btn active" data-filter="all" onclick="setFilter('all')">All</button>
    <button class="btn" data-filter="solved" onclick="setFilter('solved')">Solved</button>
    <button class="btn" data-filter="unsolved" onclick="setFilter('unsolved')">Unsolved</button>
  </div>
  <div class="ctrl-group">
    <button class="btn" onclick="expandAll()">Expand All</button>
    <button class="btn" onclick="collapseAll()">Collapse All</button>
  </div>
  <div class="ctrl-group">
    <input type="text" class="search-box" placeholder="Search problems..." oninput="searchProblems(this.value)">
  </div>
</div>

<div class="main">
  <div class="overall-progress" id="overallProgress"></div>
  <div id="treeContainer"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Solved</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div> Unsolved</div>
    <div class="legend-item"><span class="diff-badge easy">Easy</span></div>
    <div class="legend-item"><span class="diff-badge medium">Medium</span></div>
    <div class="legend-item"><span class="diff-badge hard">Hard</span></div>
    <div class="legend-item"><span class="parent-tag">PARENT</span> = Learn this first</div>
    <div class="legend-item" style="color:var(--text-muted)">Click nodes to expand/collapse</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// SOLVED PROBLEMS — keyed by a unique identifier (name-based)
// ═══════════════════════════════════════════════════════════════════
const SOLVED = new Set([
  "Two Sum II (sorted)",
  "Container With Most Water",
  "3Sum",
  "Sort Colors (Dutch Flag)",
  "Trapping Rain Water",
  "Product Except Self",
  "Maximum Subarray",
  "Subarray Sum Equals K",
  "Best Time to Buy and Sell Stock",
  "Merge Intervals",
  "Sliding Window Maximum",
  "Maximum Product Subarray",
  "Next Permutation",
  "Binary Search",
  "Search Rotated Sorted Array",
  "Reverse Linked List",
  "Linked List Cycle",
  "Linked List Cycle II",
  "Middle of Linked List",
  "Remove Nth From End",
  "Add Two Numbers",
  "Merge Two Sorted Lists",
  "Permutations",
]);

// ═══════════════════════════════════════════════════════════════════
// DS ICONS for visual differentiation
// ═══════════════════════════════════════════════════════════════════
const DS_ICONS = {
  "Arrays": "\u{1F4CA}",
  "Linked Lists": "\u{1F517}",
  "Strings": "\u{1F524}",
  "Trees": "\u{1F333}",
  "Graphs": "\u{1F578}\uFE0F",
  "Matrix": "\u{1F4DD}",
  "Intervals": "\u{2194}\uFE0F",
  "Sorted Structures": "\u{1F4C2}",
  "Answer Space": "\u{1F3AF}",
  "Advanced": "\u{1F9E0}",
  "Subsets": "\u{1F4E6}",
  "Permutations": "\u{1F500}",
  "Combinations": "\u{1F4CB}",
  "Constraints": "\u{2699}\uFE0F",
  "General": "\u{1F4A1}",
  "2D Arrays": "\u{1F4DD}",
  "Range [1,n]": "\u{1F522}",
  "Histogram / Area": "\u{1F4CA}",
  "Monotonic Deque": "\u{1F4CA}",
};

// ═══════════════════════════════════════════════════════════════════
// ALL 32 PATTERNS — every problem from PATTERN_REFERENCE.md
// Hierarchy: Pattern -> DS Group -> Problems
// ═══════════════════════════════════════════════════════════════════
const PATTERNS = [
  // ── 1. TWO POINTERS ──
  {
    id: 1, name: "Two Pointers", total: 12,
    recognition: 'Sorted array/list + find pair/triplet. OR linked list + cycle/middle/kth.',
    groups: [
      { ds: "Arrays", problems: [
        { name: "Two Sum II (sorted)", link: "https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/", lc: 167, diff: "easy", parent: true, variant: "sum too small -> left++, too big -> right--" },
        { name: "3Sum", link: "https://leetcode.com/problems/3sum/", lc: 15, diff: "medium", variant: "Fix one, two-pointer on rest. Skip duplicates" },
        { name: "Container With Most Water", link: "https://leetcode.com/problems/container-with-most-water/", lc: 11, diff: "medium", variant: "Move shorter wall inward" },
        { name: "Trapping Rain Water", link: "https://leetcode.com/problems/trapping-rain-water/", lc: 42, diff: "hard", variant: "Process shorter side; taller guarantees bottleneck" },
        { name: "Sort Colors (Dutch Flag)", link: "https://leetcode.com/problems/sort-colors/", lc: 75, diff: "medium", variant: "3 pointers: low/mid/high partition" },
        { name: "Remove Duplicates from Sorted", link: "https://leetcode.com/problems/remove-duplicates-from-sorted-array/", lc: 26, diff: "easy", variant: "Slow=write, fast=read" },
        { name: "Merge Sorted Array", link: "https://leetcode.com/problems/merge-sorted-array/", lc: 88, diff: "easy", variant: "Fill from end to avoid overwriting" },
      ]},
      { ds: "Linked Lists", problems: [
        { name: "Linked List Cycle", link: "https://leetcode.com/problems/linked-list-cycle/", lc: 141, diff: "easy", variant: "Floyd's: fast=2x, slow=1x" },
        { name: "Linked List Cycle II", link: "https://leetcode.com/problems/linked-list-cycle-ii/", lc: 142, diff: "medium", variant: "After meeting, reset to head, both speed 1" },
        { name: "Middle of Linked List", link: "https://leetcode.com/problems/middle-of-the-linked-list/", lc: 876, diff: "easy", variant: "Fast at end -> slow at middle" },
        { name: "Remove Nth From End", link: "https://leetcode.com/problems/remove-nth-node-from-end-of-list/", lc: 19, diff: "medium", variant: "Create gap of N, walk together" },
        { name: "Palindrome Linked List", link: "https://leetcode.com/problems/palindrome-linked-list/", lc: 234, diff: "easy", variant: "Find middle -> reverse half -> compare" },
      ]},
    ]
  },
  // ── 2. SLIDING WINDOW ──
  {
    id: 2, name: "Sliding Window", total: 8,
    recognition: '"subarray/substring of size K" OR "longest/shortest subarray with condition"',
    groups: [
      { ds: "Arrays", problems: [
        { name: "Max Sum Subarray Size K", link: "https://www.geeksforgeeks.org/find-maximum-minimum-sum-subarray-size-k/", lc: null, diff: "easy", parent: true, variant: "add incoming, subtract outgoing" },
        { name: "Sliding Window Maximum", link: "https://leetcode.com/problems/sliding-window-maximum/", lc: 239, diff: "hard", variant: "Monotonic deque maintains decreasing candidates" },
        { name: "Permutation in String", link: "https://leetcode.com/problems/permutation-in-string/", lc: 567, diff: "medium", variant: "Fixed window len(s1), check char frequency" },
        { name: "Fruit Into Baskets", link: "https://leetcode.com/problems/fruit-into-baskets/", lc: 904, diff: "medium", variant: "Longest subarray with <=2 distinct" },
        { name: "Max Consecutive Ones III", link: "https://leetcode.com/problems/max-consecutive-ones-iii/", lc: 1004, diff: "medium", variant: "Longest subarray with <=k zeros" },
      ]},
      { ds: "Strings", problems: [
        { name: "Longest Substring Without Repeating", link: "https://leetcode.com/problems/longest-substring-without-repeating-characters/", lc: 3, diff: "medium", variant: "Expand right, shrink on duplicate (set/map)" },
        { name: "Minimum Window Substring", link: "https://leetcode.com/problems/minimum-window-substring/", lc: 76, diff: "hard", variant: "Expand to include all chars, shrink to minimize" },
        { name: "Longest Repeating Char Replacement", link: "https://leetcode.com/problems/longest-repeating-character-replacement/", lc: 424, diff: "medium", variant: "Valid if window - max_freq <= k" },
      ]},
    ]
  },
  // ── 3. BINARY SEARCH ──
  {
    id: 3, name: "Binary Search", total: 11,
    recognition: 'Sorted data + find element. OR "minimize max" / "maximize min" / "find minimum K such that..."',
    groups: [
      { ds: "Arrays", problems: [
        { name: "Binary Search", link: "https://leetcode.com/problems/binary-search/", lc: 704, diff: "easy", parent: true, variant: "mid = left + (right-left)//2" },
        { name: "Search Insert Position", link: "https://leetcode.com/problems/search-insert-position/", lc: 35, diff: "easy", variant: "Not found -> left is insert position" },
        { name: "Find First and Last Position", link: "https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/", lc: 34, diff: "medium", variant: "Two BS: leftmost + rightmost" },
        { name: "Search Rotated Sorted Array", link: "https://leetcode.com/problems/search-in-rotated-sorted-array/", lc: 33, diff: "medium", variant: "Identify sorted half, check if target in it" },
        { name: "Find Min in Rotated Sorted", link: "https://leetcode.com/problems/find-minimum-in-rotated-sorted-array/", lc: 153, diff: "medium", variant: "Compare mid with right" },
        { name: "Find Peak Element", link: "https://leetcode.com/problems/find-peak-element/", lc: 162, diff: "medium", variant: "mid < mid+1 -> peak is right" },

// Helpers
// ═══════════════════════════════════════════════════════════════════
function isSolved(name) { return SOLVED.has(name); }

function getIcon(ds) { return DS_ICONS[ds] || "\u{1F4C1}"; }

function getDiffClass(d) {
  if (d === 'easy') return 'easy';
  if (d === 'medium') return 'medium';
  return 'hard';
}
function getDiffLabel(d) {
  if (d === 'easy') return 'Easy';
  if (d === 'medium') return 'Med';
  return 'Hard';
}

function countSolved(pattern) {
  let c = 0;
  for (const g of pattern.groups) {
    for (const p of g.problems) {
      if (isSolved(p.name)) c++;
    }
  }
  return c;
}

function countTotal(pattern) {
  let c = 0;
  for (const g of pattern.groups) c += g.problems.length;
  return c;
}

// ═══════════════════════════════════════════════════════════════════
// Render Stats
// ═══════════════════════════════════════════════════════════════════
function renderStats() {
  let totalProblems = 0, totalSolved = 0;
  for (const pat of PATTERNS) {
    totalProblems += countTotal(pat);
    totalSolved += countSolved(pat);
  }
  const patternsStarted = PATTERNS.filter(p => countSolved(p) > 0).length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card green"><div class="num">${totalSolved}</div><div class="label">Solved</div></div>
    <div class="stat-card blue"><div class="num">${totalProblems}</div><div class="label">Total Problems</div></div>
    <div class="stat-card purple"><div class="num">${PATTERNS.length}</div><div class="label">Patterns</div></div>
    <div class="stat-card yellow"><div class="num">${patternsStarted}</div><div class="label">Patterns Started</div></div>
    <div class="stat-card"><div class="num" style="color:var(--text-secondary)">${totalProblems - totalSolved}</div><div class="label">Remaining</div></div>
  `;
  // Overall progress bar
  const pct = totalProblems > 0 ? Math.round((totalSolved / totalProblems) * 100) : 0;
  document.getElementById('overallProgress').innerHTML = `
    <div class="label-row"><span>Overall Progress</span><span>${totalSolved} / ${totalProblems} (${pct}%)</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
}

// ═══════════════════════════════════════════════════════════════════
// Render Tree
// ═══════════════════════════════════════════════════════════════════
function renderTree() {
  const container = document.getElementById('treeContainer');
  let html = '';

  for (const pat of PATTERNS) {
    const s = countSolved(pat);
    const t = countTotal(pat);
    const pct = t > 0 ? Math.round((s / t) * 100) : 0;
    const barColor = pct >= 70 ? 'green' : pct >= 30 ? 'yellow' : 'blue';
    const hasSolved = s > 0 ? ' has-solved' : '';

    html += `<div class="pattern-node collapsed${hasSolved}" data-pattern-id="${pat.id}">`;
    html += `<div class="pattern-header" onclick="togglePattern(this)">`;
    html += `<span class="chevron">\u25BC</span>`;
    html += `<span class="pattern-number">${pat.id}</span>`;
    html += `<span class="pattern-name">${pat.name}</span>`;
    html += `<span class="pattern-count">${s}/${t}</span>`;
    html += `<span class="pattern-bar">`;
    html += `<span class="pattern-bar-track"><span class="pattern-bar-fill ${barColor}" style="width:${pct}%"></span></span>`;
    html += `<span class="pattern-bar-pct">${pct}%</span>`;
    html += `</span>`;
    html += `</div>`; // end pattern-header

    html += `<div class="pattern-body">`;
    html += `<div class="pattern-recognition">${pat.recognition}</div>`;

    for (const group of pat.groups) {
      const gSolved = group.problems.filter(p => isSolved(p.name)).length;
      const gTotal = group.problems.length;

      html += `<div class="ds-branch" data-ds="${group.ds}">`;
      html += `<div class="ds-header" onclick="toggleDS(this)">`;
      html += `<span class="ds-chevron">\u25BC</span>`;
      html += `<span class="ds-icon">${getIcon(group.ds)}</span>`;
      html += `<span class="ds-name">${group.ds}</span>`;
      html += `<span class="ds-count">${gSolved}/${gTotal}</span>`;
      html += `</div>`; // end ds-header

      html += `<div class="ds-problems">`;
      for (const p of group.problems) {
        const solved = isSolved(p.name);
        const lcLabel = p.lc ? `<a href="${p.link}" target="_blank">#${p.lc}</a>` : `<a href="${p.link}" target="_blank">GFG</a>`;
        html += `<div class="problem" data-solved="${solved}" data-name="${p.name.toLowerCase()}">`;
        html += `<span class="status-dot ${solved ? 'solved' : 'unsolved'}"></span>`;
        if (p.parent) html += `<span class="parent-tag">PARENT</span>`;
        html += `<span class="problem-name">${p.name} ${lcLabel}</span>`;
        html += `<span class="diff-badge ${getDiffClass(p.diff)}">${getDiffLabel(p.diff)}</span>`;
        if (p.variant) html += `<span class="variant-text" title="${p.variant}">${p.variant}</span>`;
        html += `</div>`; // end problem
      }
      html += `</div>`; // end ds-problems
      html += `</div>`; // end ds-branch
    }

    html += `</div>`; // end pattern-body
    html += `</div>`; // end pattern-node
  }

  container.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════
// Interactions
// ═══════════════════════════════════════════════════════════════════
function togglePattern(header) {
  header.closest('.pattern-node').classList.toggle('collapsed');
}

function toggleDS(header) {
  header.closest('.ds-branch').classList.toggle('collapsed');
}

function expandAll() {
  document.querySelectorAll('.pattern-node.collapsed').forEach(el => el.classList.remove('collapsed'));
  document.querySelectorAll('.ds-branch.collapsed').forEach(el => el.classList.remove('collapsed'));
}

function collapseAll() {
  document.querySelectorAll('.pattern-node').forEach(el => el.classList.add('collapsed'));
  document.querySelectorAll('.ds-branch').forEach(el => el.classList.add('collapsed'));
}

function setFilter(type) {
  document.querySelectorAll('.btn[data-filter]').forEach(b => b.classList.remove('active'));
  document.querySelector(`.btn[data-filter="${type}"]`).classList.add('active');

  document.querySelectorAll('.problem').forEach(el => {
    if (type === 'all') {
      el.style.display = '';
    } else if (type === 'solved') {
      el.style.display = el.dataset.solved === 'true' ? '' : 'none';
    } else {
      el.style.display = el.dataset.solved === 'false' ? '' : 'none';
    }
  });

  // Hide empty DS branches when filtering
  document.querySelectorAll('.ds-branch').forEach(branch => {
    const visible = branch.querySelectorAll('.problem:not([style*="display: none"])');
    branch.style.display = visible.length > 0 ? '' : 'none';
  });

  // Hide empty pattern nodes when filtering
  document.querySelectorAll('.pattern-node').forEach(node => {
    const visible = node.querySelectorAll('.problem:not([style*="display: none"])');
    node.style.display = visible.length > 0 ? '' : 'none';
  });
}

function searchProblems(query) {
  const q = query.toLowerCase().trim();
  if (!q) {
    document.querySelectorAll('.problem').forEach(el => el.style.display = '');
    document.querySelectorAll('.ds-branch').forEach(el => el.style.display = '');
    document.querySelectorAll('.pattern-node').forEach(el => el.style.display = '');
    return;
  }

  document.querySelectorAll('.problem').forEach(el => {
    const name = el.dataset.name || '';
    el.style.display = name.includes(q) ? '' : 'none';
  });

  // Hide empty DS branches
  document.querySelectorAll('.ds-branch').forEach(branch => {
    const visible = branch.querySelectorAll('.problem:not([style*="display: none"])');
    branch.style.display = visible.length > 0 ? '' : 'none';
  });

  // Hide empty patterns, expand those with matches
  document.querySelectorAll('.pattern-node').forEach(node => {
    const visible = node.querySelectorAll('.problem:not([style*="display: none"])');
    if (visible.length > 0) {
      node.style.display = '';
      node.classList.remove('collapsed');
      node.querySelectorAll('.ds-branch').forEach(b => {
        if (b.style.display !== 'none') b.classList.remove('collapsed');
      });
    } else {
      node.style.display = 'none';
    }
  });
}

// ═══════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════
renderStats();
renderTree();
</script>
